name: Daily Smart Subscription Mixer

on:
  schedule:
    - cron: '0 4 * * *' # اجرا به صورت خودکار روزی یک‌بار ساعت ۴ صبح به وقت UTC (۷:۳۰ صبح ایران)
  workflow_dispatch: # امکان اجرای دستی در هر زمان

permissions:
  contents: write

jobs:
  daily-mix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0 # واکشی کامل سابقه گیت جهت ارزیابی دقیق تاریخچه آپدیت فایل‌ها

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install geoip2

      - name: Download GeoLite2 Country Database
        run: |
          mkdir -p utils
          # دانلود دیتابیس بومی و آفلاین جهت واکشی اطلاعات کشورها بدون محدودیت و با نهایت سرعت
          wget -O utils/Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Run Daily Smart Mixer
        run: |
          python scripts/daily_mix.py

      - name: Commit and Push Daily Mixes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sub/
          if git diff --staged --quiet; then
            echo "هیچ تغییر جدیدی در میکس روزانه وجود ندارد."
          else
            git commit -m "بروزرسانی خودکار میکس و دسته‌بندی روزانه - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
