name: Daily Smart Subscription Mixer

on:
  schedule:
    - cron: '0 4 * * *' # اجرا به صورت خودکار روزی یک‌بار ساعت ۴ صبح به وقت UTC (۷:۳۰ صبح ایران)
  workflow_dispatch: # امکان اجرای دستی در هر زمان

permissions:
  contents: write

jobs:
  daily-mix:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0 # واکشی کامل سابقه گیت جهت ارزیابی دقیق تاریخچه آپدیت فایل‌ها

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pyyaml geoip2 requests urllib3
          fi

      - name: 🌐 Prepare GeoIP Database
        run: |
          mkdir -p utils
          if [ ! -f utils/Country.mmdb ] || [ $(find utils/Country.mmdb -mtime +14 2>/dev/null) ]; then
            echo "در حال دانلود پایگاه داده جغرافیایی آفلاین کشورها..."
            wget -q -O utils/Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb || true
          fi

      - name: 🌀 Run Daily Smart Mixer
        run: |
          python scripts/daily_mix.py
          python scripts/readme_generator.py

      - name: 🚀 Commit and Push Daily Mixes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          git config --global core.compression 9

          push_chunk() {
            local target="$1"
            local desc="$2"
            git add $target 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "ℹ️ تغییری در $desc وجود ندارد."
              return 0
            fi
            git commit -m "$desc - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            for attempt in 1 2 3 4 5; do
              if git push origin main; then
                echo "✅ $desc با موفقیت ارسال شد (تلاش $attempt)."
                return 0
              fi
              echo "⚠️ تلاش $attempt ناموفق بود، در حال ری‌بیس و تلاش مجدد..."
              git pull --rebase origin main || git rebase --abort 2>/dev/null || true
              sleep 3
            done
            echo "❌ خطا در ارسال $desc به گیت‌هاب."
            return 1
          }

          push_chunk "sources.txt inactive_sources.txt README.md" "📝 بروزرسانی مستندات میکس روزانه" || exit 1
          push_chunk "sub/" "🌀 بروزرسانی دسته‌بندی‌ها و فایل‌های میکس روزانه" || exit 1
