name: Modular Sub Subscription Updater

on:
  schedule:
    - cron: '0 * * * *' # اجرا به صورت خودکار سر هر ساعت (هر ۱ ساعت یک‌بار)
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'حالت اجرای فرآیند (Run Mode)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - download_only
          - mix_only
          - base64_only
          - clash_only

permissions:
  contents: write

jobs:
  update-subscriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0 # واکشی کامل تاریخچه لاگ گیت جهت محاسبه دقیق زمان بروزرسانی فایل‌ها

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Modular Subscription Updater
        run: |
          python scripts/main.py --mode "${{ github.event.inputs.run_mode || 'all' }}"

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # اضافه کردن پوشه ساب و فایل ریدمی تولید شده به بخش استیج گیت
          git add sub/ README.md
          if git diff --staged --quiet; then
            echo "هیچ تغییری برای ثبت وجود ندارد."
          else
            git commit -m "بروزرسانی خودکار منابع و مستندات - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
