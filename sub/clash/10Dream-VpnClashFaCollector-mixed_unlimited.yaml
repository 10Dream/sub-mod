  fake-ip-filter-mode: "blacklist"
  fake-ip-filter:
    - "geosite:private"
    - "+.lan"
    - "+.localdomain"
    - "+.invalid"
    - "+.localhost"
    - "+.test"
    - "+.local"
    - "+.home.arpa"
    - "+.arpa"
    - "+.ir"
