global-client-fingerprint: "chrome"
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
tcp-concurrent: true
enable-process: true
find-process-mode: "always"
ipv6: true
log-level: "info"
geo-auto-update: true
geo-update-interval: 168
secret: ""
bind-address: "*"
unified-delay: false
disable-keep-alive: false
keep-alive-idle: 30
keep-alive-interval: 30
dns:
  enable: true
  ipv6: true
  respect-rules: false
  prefer-h3: true
  cache-algorithm: "arc"
  use-system-hosts: true
  use-host: true
  listen: "0.0.0.0:53"
  enhanced-mode: "fake-ip"
  fake-ip-filter-mode: "blacklist"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "*.lan"
    - "*.localdomain"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "*.ir"
  default-nameserver:
    - "8.8.8.8"
    - "8.8.4.4"
    - "1.1.1.1"
    - "9.9.9.9"
  nameserver:
    - "https://dns.google/dns-query"
    - "https://cloudflare-dns.com/dns-query"
  direct-nameserver:
    - "78.157.42.100"
    - "78.157.42.101"
  proxy-server-nameserver:
    - "1.1.1.1"
    - "8.8.8.8"
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080
        - 8880
        - 2052
        - 2082
        - 2086
        - 2095
    TLS:
      ports:
        - 443
        - 8443
        - 2053
        - 2083
        - 2087
        - 2096
tun:
  enable: true
  stack: "mixed"
  auto-route: true
  auto-detect-interface: true
  auto-redir: true
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
rule-providers:
  local_ips:
    type: "http"
    behavior: "ipcidr"
    url: "https://raw.githubusercontent.com/10ium/V2rayDomains2Clash/generated/local-ips.yaml"
    interval: 86400
    path: "./ruleset/local_ips.yaml"
  category_ir:
    type: "http"
    behavior: "domain"
    url: "https://raw.githubusercontent.com/10ium/V2rayDomains2Clash/generated/category-ir.yaml"
    interval: 86400
    path: "./ruleset/category_ir.yaml"
  iran:
