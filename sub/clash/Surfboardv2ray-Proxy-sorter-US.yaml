    - "https://dns.google/dns-query"
    - "https://cloudflare-dns.com/dns-query"
  direct-nameserver:
    - "78.157.42.100"
    - "78.157.42.101"
  proxy-server-nameserver:
    - "1.1.1.1"
    - "8.8.8.8"
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080
        - 8880
        - 2052
        - 2082
        - 2086
        - 2095
    TLS:
      ports:
        - 443
        - 8443
        - 2053
        - 2083
        - 2087
        - 2096
tun:
  enable: true
  stack: "mixed"
  auto-route: true
  auto-detect-interface: true
  auto-redir: true
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
rule-providers:
  local_ips:
    type: "http"
    behavior: "ipcidr"
    url: "https://raw.githubusercontent.com/10ium/V2rayDomains2Clash/generated/local-ips.yaml"
    interval: 86400
    path: "./ruleset/local_ips.yaml"
  category_ir:
