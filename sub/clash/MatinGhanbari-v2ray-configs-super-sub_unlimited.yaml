  listen: "0.0.0.0:53"
  ipv6: false
  prefer-h3: false
  cache-algorithm: "arc"
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter-mode: "blacklist"
  fake-ip-filter:
