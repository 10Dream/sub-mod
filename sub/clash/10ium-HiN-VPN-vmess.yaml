      - "دستی 🤏🏻"
      - "بدون فیلترشکن 🛡️"
      - "قطع اینترنت ⛔"
  - name: "دستی 🤏🏻"
    type: "select"
    proxies:
      - "🆔configfa 🔒 VM-WS- 🇺🇸 US down"
      - "🆔configfa 🔒 VM-WS- 🇩🇪 DE 104ms"
      - "🆔surfboardv2ray 🔒 VM-WS-TLS ❔ XX down"
      - "🆔surfboardv2ray 🔒 VM-WS-TLS ❔ XX down-1"
      - "🆔surfboardv2ray 🔒 VM-WS-TLS ❔ XX down-2"
      - "🆔surfboardv2ray 🔓 VM-TCP-N/A ❔ XX 113ms"
      - "🆔spotify_porteghali 🔓 VM-TCP-N/A ❔ XX down"
  - name: "خودکار (بهترین پینگ) 🤖"
    type: "url-test"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true
    proxies:
      - "🆔configfa 🔒 VM-WS- 🇺🇸 US down"
      - "🆔configfa 🔒 VM-WS- 🇩🇪 DE 104ms"
      - "🆔surfboardv2ray 🔒 VM-WS-TLS ❔ XX down"
      - "🆔surfboardv2ray 🔒 VM-WS-TLS ❔ XX down-1"
      - "🆔surfboardv2ray 🔒 VM-WS-TLS ❔ XX down-2"
      - "🆔surfboardv2ray 🔓 VM-TCP-N/A ❔ XX 113ms"
      - "🆔spotify_porteghali 🔓 VM-TCP-N/A ❔ XX down"
  - name: "سایتای ایرانی 🇮🇷"
    type: "select"
    proxies:
      - "بدون فیلترشکن 🛡️"
      - "نوع انتخاب پروکسی 🔀"
      - "خودکار (بهترین پینگ) 🤖"
      - "دستی 🤏🏻"
      - "اجازه ندادن 🚫"
  - name: "تلگرام 💬"
    type: "select"
    proxies:
      - "نوع انتخاب پروکسی 🔀"
      - "بدون فیلترشکن 🛡️"
      - "خودکار (بهترین پینگ) 🤖"
      - "دستی 🤏🏻"
      - "اجازه ندادن 🚫"
  - name: "بدون فیلترشکن 🛡️"
    type: "select"
    proxies:
      - "DIRECT"
    hidden: true
  - name: "قطع اینترنت ⛔"
    type: "select"
    proxies:
      - "REJECT"
    hidden: true
  - name: "اجازه ندادن 🚫"
    type: "select"
    proxies:
      - "REJECT"
    hidden: true
rules:
  - "RULE-SET,local_ips,بدون فیلترشکن 🛡️"
  - "PROCESS-NAME,Telegram.exe,تلگرام 💬"
  - "PROCESS-NAME,org.telegram.messenger,تلگرام 💬"
