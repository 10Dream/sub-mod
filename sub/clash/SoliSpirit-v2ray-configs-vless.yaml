    - "+.lan"
    - "+.localdomain"
    - "+.invalid"
    - "+.localhost"
    - "+.test"
    - "+.local"
    - "+.home.arpa"
    - "+.arpa"
    - "+.ir"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.apple.com"
