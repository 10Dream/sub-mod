sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: false
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - "8080-8880"
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
tun:
  enable: true
  stack: "mips"
  dns-mode: "hijack"
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  route-exclude-address:
