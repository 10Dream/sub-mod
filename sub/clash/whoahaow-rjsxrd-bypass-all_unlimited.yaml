    - "tcp://8.8.8.8"
    - "tcp://9.9.9.9"
    - "1.1.1.1"
    - "8.8.8.8"
    - "9.9.9.9"
    - "tcp://1.0.0.1"
    - "tcp://8.8.4.4"
    - "tcp://149.112.112.112"
    - "tcp://208.67.222.222"
    - "tcp://208.67.220.220"
  direct-nameserver:
    - "78.157.42.100"
    - "78.157.42.101"
    - "tcp://78.157.42.100"
    - "tcp://78.157.42.101"
