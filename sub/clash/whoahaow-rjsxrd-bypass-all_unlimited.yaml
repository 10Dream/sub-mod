  prefer-h3: false
  cache-algorithm: "arc"
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter-mode: "blacklist"
  fake-ip-filter:
    - "geosite:private"
    - "+.lan"
    - "+.localdomain"
    - "+.invalid"
    - "+.localhost"
    - "+.test"
    - "+.local"
    - "+.home.arpa"
    - "+.arpa"
    - "+.ir"
    - "time.*.com"
    - "time.*.gov"
