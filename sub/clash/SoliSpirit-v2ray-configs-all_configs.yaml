    +.lan: "system"
    +.local: "system"
    +.home.arpa: "system"
    router.asus.com: "system"
    tplinkwifi.net: "system"
    tplinkrepeater.net: "system"
    tplinkap.net: "system"
    routerlogin.net: "system"
    routerlogin.com: "system"
    melogin.cn: "system"
    falogin.cn: "system"
    tendawifi.com: "system"
    leike.cc: "system"
    miwifi.com: "system"
    goforward.link: "system"
