tcp-concurrent: true
find-process-mode: "strict"
profile:
  store-selected: true
  store-fake-ip: true
port: 7892
socks-port: 7891
mixed-port: 7890
allow-lan: true
mode: "rule"
log-level: "warning"
external-controller: "0.0.0.0:9090"
secret: ""
ipv6: true
dns:
