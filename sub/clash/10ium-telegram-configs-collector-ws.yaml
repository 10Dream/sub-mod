    - "tcp://8.8.8.8"
    - "1.1.1.1"
    - "8.8.8.8"
    - "9.9.9.9"
    - "tcp://1.0.0.1"
    - "tcp://8.8.4.4"
    - "tcp://9.9.9.9"
