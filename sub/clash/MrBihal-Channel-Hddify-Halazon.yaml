    type: "select"
    proxies:
      - "خودکار (بهترین پینگ) 🤖"
      - "دستی 🤏🏻"
      - "بدون فیلترشکن 🛡️"
      - "قطع اینترنت ⛔"
  - name: "دستی 🤏🏻"
    type: "select"
    proxies:
      - "🐌 - Tel:  @Hddify - 1"
      - "🐌 - Tel:  @Hddify - 2"
      - "🐌 - Tel:  @Hddify - 3"
      - "🐌 - Tel:  @Hddify - 9"
      - "🐌 - Tel:  @Hddify - 11"
