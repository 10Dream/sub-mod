    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "router.asus.com"
    - "tplinkwifi.net"
    - "tplinkrepeater.net"
    - "tplinkap.net"
    - "routerlogin.net"
    - "routerlogin.com"
