    - "time.*.gov"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "+.ntp.org"
    - "time.asis.io"
    - "time.windows.com"
    - "time.apple.com"
    - "connectivitycheck.gstatic.com"
    - "connectivitycheck.android.com"
    - "clients3.google.com"
    - "captive.apple.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "router.asus.com"
    - "tplinkwifi.net"
    - "tplinkrepeater.net"
    - "tplinkap.net"
    - "routerlogin.net"
    - "routerlogin.com"
