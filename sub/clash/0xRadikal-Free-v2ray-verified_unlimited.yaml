    - "time.apple.com"
    - "connectivitycheck.gstatic.com"
    - "connectivitycheck.android.com"
    - "clients3.google.com"
    - "captive.apple.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "router.asus.com"
    - "tplinkwifi.net"
    - "tplinkrepeater.net"
    - "tplinkap.net"
    - "routerlogin.net"
    - "routerlogin.com"
