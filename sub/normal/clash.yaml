  - name: سایتای ایرانی 🇮🇷
    type: select
    proxies:
      - بدون فیلترشکن 🛡️
      - نوع انتخاب پروکسی 🔀
      - خودکار (بهترین پینگ) 🤖
      - دستی 🤏🏻
      - اجازه ندادن 🚫
  - name: تلگرام 💬
    type: select
    proxies:
      - نوع انتخاب پروکسی 🔀
      - بدون فیلترشکن 🛡️
      - خودکار (بهترین پینگ) 🤖
      - دستی 🤏🏻
      - اجازه ندادن 🚫
  - name: بدون فیلترشکن 🛡️
    type: select
    proxies:
      - DIRECT
    hidden: true
  - name: قطع اینترنت ⛔
    type: select
    proxies:
      - REJECT
    hidden: true
  - name: اجازه ندادن 🚫
    type: select
    proxies:
      - REJECT
    hidden: true
